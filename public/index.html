<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Codex ondev</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0d10;
  --bg-soft: #11151b;
  --panel: #141a21;
  --line: #232c36;
  --line-soft: #1a222b;
  --ink: #e8edf4;
  --muted: #8b98a8;
  --dim: #63707f;
  --accent: #5b9dff;
  --accent-soft: rgba(91, 157, 255, 0.12);
  --ok: #4ec98a;
  --warn: #e0a44c;
  --bad: #ef6b6b;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Liberation Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1100px 600px at 50% -15%, rgba(91,157,255,0.10), transparent 70%),
    linear-gradient(180deg, rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px),
    var(--bg);
  background-size: auto, 36px 36px, 36px 36px, auto;
  color: var(--ink);
  font-family: var(--sans);
  overflow-y: auto;
  padding: 32px 18px 24px;
  min-height: 100dvh;
}
.shell { width: min(560px, 100%); margin: 0 auto; }
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.mark {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  background: linear-gradient(150deg, #1d2a3d, #10161f);
  border: 1px solid #2b3a4e;
  display: grid;
  place-items: center;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  box-shadow: 0 8px 30px rgba(91,157,255,0.10);
}
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.1px; }
.brand p { margin: 2px 0 0; color: var(--dim); font-size: 12px; font-family: var(--mono); }
.card {
  background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.35);
}
.status-row { display: flex; align-items: center; gap: 14px; }
.orb {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--line);
  border-top-color: var(--accent);
  animation: spin 0.9s linear infinite;
}
.orb.ready { animation: none; border-color: var(--ok); background: rgba(78,201,138,0.12); position: relative; }
.orb.ready::after { content: "\2713"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--ok); font-size: 16px; font-weight: 700; }
.orb.failed { animation: none; border-color: var(--bad); background: rgba(239,107,107,0.10); }
@keyframes spin { to { transform: rotate(360deg); } }
.status-copy { min-width: 0; flex: 1; }
.status-copy h2 { margin: 0; font-size: 16px; font-weight: 600; }
.status-copy p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.progress {
  height: 5px;
  border-radius: 99px;
  background: var(--line-soft);
  margin: 18px 0 6px;
  overflow: hidden;
}
.progress > span {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, #3d7fe0, var(--accent));
  transition: width 0.35s ease;
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 10.5px;
}
.steps { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 2px; }
.steps li {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 9px;
  align-items: baseline;
  padding: 6px 2px;
  font-size: 13px;
  color: var(--muted);
}
.steps li .dot { color: var(--dim); font-family: var(--mono); font-size: 12px; }
.steps li.done { color: var(--ink); }
.steps li.done .dot { color: var(--ok); }
.steps li.active { color: var(--accent); }
.steps li.active .dot { color: var(--accent); animation: blink 1s steps(2) infinite; }
.steps li.failed { color: var(--bad); }
.steps li.failed .dot { color: var(--bad); }
.steps li .detail { color: var(--dim); font-size: 10.5px; font-family: var(--mono); text-align: right; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes blink { 50% { opacity: 0.25; } }
.error {
  margin-top: 16px;
  border: 1px solid rgba(239,107,107,0.35);
  background: rgba(239,107,107,0.08);
  color: #ffb4b4;
  border-radius: 10px;
  padding: 11px 13px;
  font-size: 12.5px;
  line-height: 1.5;
  font-family: var(--mono);
  word-break: break-word;
}
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
button, .button {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  color: var(--ink);
  border-radius: 9px;
  padding: 10px 16px;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
}
button.primary, .button.primary {
  background: var(--accent-soft);
  border-color: rgba(91,157,255,0.45);
  color: #a9cbff;
}
button:disabled { opacity: 0.35; pointer-events: none; }
details {
  margin-top: 16px;
  border-top: 1px solid var(--line-soft);
  padding-top: 12px;
}
summary { color: var(--dim); font-size: 11.5px; cursor: pointer; font-family: var(--mono); }
pre {
  margin: 10px 0 0;
  background: #080a0d;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 10px;
  max-height: 210px;
  overflow: auto;
  color: #aab6c4;
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.foot {
  margin-top: 12px;
  color: var(--dim);
  font-size: 10.5px;
  font-family: var(--mono);
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
@media (max-width: 480px) {
  .card { padding: 18px; }
  .steps li .detail { display: none; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <div class="mark">&gt;_</div>
    <div>
      <h1>Codex ondev</h1>
      <p id="brandMeta">local agent runtime</p>
    </div>
  </div>
  <div class="card">
    <div class="status-row">
      <div class="orb" id="orb"></div>
      <div class="status-copy">
        <h2 id="headline">Preparing runtime</h2>
        <p id="subline">Extracting and verifying the local environment.</p>
      </div>
    </div>
    <div class="progress"><span id="bar"></span></div>
    <div class="progress-meta">
      <span id="stepCount">0 / 7</span>
      <span id="phaseLabel">boot</span>
    </div>
    <ul class="steps" id="steps"></ul>
    <div class="error" id="errorBox" style="display:none"></div>
    <div class="actions">
      <a class="button primary" id="openBtn" href="#" style="display:none">Open bb</a>
      <button id="retryBtn" style="display:none">Retry</button>
      <button id="stayBtn" style="display:none">Stay on this page</button>
    </div>
    <details>
      <summary>Runtime log</summary>
      <pre id="logs">Waiting for output...</pre>
    </details>
    <div class="foot">
      <span id="portLabel">127.0.0.1:1400</span>
      <span id="readyLabel">starting</span>
    </div>
  </div>
</div>
<script>
(function () {
  window.scrollTo(0, 0);
  window.addEventListener('pageshow', function () { window.scrollTo(0, 0); });

  var orb = document.getElementById('orb');
  var headline = document.getElementById('headline');
  var subline = document.getElementById('subline');
  var bar = document.getElementById('bar');
  var stepCount = document.getElementById('stepCount');
  var phaseLabel = document.getElementById('phaseLabel');
  var stepsEl = document.getElementById('steps');
  var errorBox = document.getElementById('errorBox');
  var logsEl = document.getElementById('logs');
  var openBtn = document.getElementById('openBtn');
  var retryBtn = document.getElementById('retryBtn');
  var stayBtn = document.getElementById('stayBtn');
  var readyLabel = document.getElementById('readyLabel');
  var stay = new URLSearchParams(location.search).get('stay') === '1';
  var redirected = false;
  var lastSignature = '';

  stayBtn.addEventListener('click', function () {
    stay = true;
    stayBtn.style.display = 'none';
  });

  retryBtn.addEventListener('click', function () {
    retryBtn.disabled = true;
    fetch('/api/retry', { method: 'POST' }).catch(function () {});
    setTimeout(function () { retryBtn.disabled = false; }, 2500);
  });

  function renderSteps(setup, runtime) {
    var steps = (setup && setup.steps) || [];
    var signature = JSON.stringify(steps.map(function (step) {
      return [step.id, step.done, step.error, step.detail];
    })) + '|' + (setup && setup.currentStep);
    if (signature === lastSignature) return;
    lastSignature = signature;
    stepsEl.innerHTML = '';
    for (var i = 0; i < steps.length; i += 1) {
      var step = steps[i];
      var li = document.createElement('li');
      var dot = document.createElement('span');
      dot.className = 'dot';
      var label = document.createElement('span');
      label.textContent = step.label;
      var detail = document.createElement('span');
      detail.className = 'detail';
      detail.textContent = step.detail || step.error || '';
      if (step.error) {
        li.className = 'failed';
        dot.textContent = '\u2715';
      } else if (step.done) {
        li.className = 'done';
        dot.textContent = '\u2713';
      } else if (setup && setup.currentStep === step.label) {
        li.className = 'active';
        dot.textContent = '\u25CF';
      } else {
        dot.textContent = '\u25CB';
      }
      li.appendChild(dot);
      li.appendChild(label);
      li.appendChild(detail);
      stepsEl.appendChild(li);
    }
    var done = steps.filter(function (step) { return step.done; }).length;
    var total = steps.length || 7;
    var pct = Math.round((done / total) * 100);
    if (runtime && runtime.ready) pct = 100;
    bar.style.width = pct + '%';
    stepCount.textContent = done + ' / ' + total;
  }

  function renderLogs(payload) {
    var runtime = payload.runtime || {};
    var logs = runtime.logs || {};
    var lines = [];
    var launcher = payload.launcher || [];
    var setupLogs = (payload.setup && payload.setup.error) ? ['setup: ' + payload.setup.error] : [];
    lines = lines.concat(launcher.slice(-4));
    lines = lines.concat(setupLogs);
    lines = lines.concat((logs.configure || []).slice(-6));
    lines = lines.concat((logs.opencode || []).slice(-8));
    lines = lines.concat((logs.bb || []).slice(-10));
    logsEl.textContent = lines.length ? lines.join('\n') : 'Waiting for output...';
    logsEl.scrollTop = logsEl.scrollHeight;
  }

  function render(payload) {
    var setup = payload.setup || {};
    var runtime = payload.runtime || {};
    renderSteps(setup, runtime);
    renderLogs(payload);

    var failed = Boolean(setup.failed) || runtime.phase === 'Failed';
    var ready = Boolean(runtime.ready);
    var errorMessage = setup.error || runtime.error || '';

    orb.className = 'orb' + (ready ? ' ready' : (failed ? ' failed' : ''));
    errorBox.style.display = errorMessage ? 'block' : 'none';
    errorBox.textContent = errorMessage;
    retryBtn.style.display = failed ? '' : 'none';
    openBtn.style.display = ready ? '' : 'none';

    if (ready) {
      headline.textContent = 'bb is ready';
      subline.textContent = 'Opening the bb workspace on this device.';
      phaseLabel.textContent = 'ready';
      readyLabel.textContent = 'running';
      openBtn.href = runtime.bbUrl || 'http://127.0.0.1:38886/';
      if (!stay) {
        stayBtn.style.display = '';
        if (!redirected) {
          redirected = true;
          setTimeout(function () {
            if (!stay) location.href = openBtn.href;
          }, 900);
        }
      }
      return;
    }

    if (failed) {
      headline.textContent = 'Runtime needs attention';
      subline.textContent = 'The setup or an agent process did not start. Check the log below.';
      phaseLabel.textContent = 'failed';
      readyLabel.textContent = 'stopped';
      return;
    }

    if (runtime.phase === 'Starting bb web UI') {
      headline.textContent = 'Starting bb';
      subline.textContent = 'Launching the bb server and local host daemon.';
    } else if (runtime.phase === 'Configuring OpenCode provider') {
      headline.textContent = 'Connecting OpenCode';
      subline.textContent = 'Registering the in-rootfs OpenCode provider with bb.';
    } else if (runtime.phase === 'Starting OpenCode') {
      headline.textContent = 'Starting OpenCode';
      subline.textContent = 'Booting the local OpenCode serve process.';
    } else {
      headline.textContent = 'Preparing runtime';
      subline.textContent = setup.currentStep ? ('Working on ' + setup.currentStep.toLowerCase() + '.') : 'Checking the local environment.';
    }
    phaseLabel.textContent = runtime.phase || 'boot';
    readyLabel.textContent = 'starting';
  }

  function poll() {
    fetch('/api/status', { cache: 'no-store' })
      .then(function (response) { return response.json(); })
      .then(render)
      .catch(function () {
        headline.textContent = 'Waiting for launcher';
        subline.textContent = 'The local runtime is still starting.';
      });
  }

  poll();
  setInterval(poll, 900);
})();
</script>
</body>
</html>
